name: BERRY Local QA + Windows EXE
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-linux:
    name: Unit tests / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local app and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q berry tools tests berry_launcher.py
      - name: Unit tests (no social/cloud)
        run: python -m pytest -q
      - name: AFINA 15-second local MP4 smoke
        run: python tools/smoke_afina.py

  windows-build:
    name: Windows tests + portable EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local app and test dependencies
        run: python -m pip install -r requirements-dev.txt "pyinstaller>=6,<7"
      - name: Unit tests (Windows)
        run: python -m pytest -q
      - name: AFINA 15-second local MP4 smoke
        run: python tools/smoke_afina.py
      - name: Package standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name BERRY_AI_AUTOPILOT `
            --add-data "static;static" `
            --add-data "tools/wangp_worker.py;tools" `
            --add-data "tools/whisper_worker.py;tools" `
            --add-data "tools/blender_fruit_scene.py;tools" `
            --hidden-import berry.app `
            --hidden-import berry.jarvis_api `
            --hidden-import berry.hyperframes_bridge `
            --hidden-import berry.openclipper_bridge `
            --hidden-import berry.social_oauth `
            --hidden-import berry.social_routes `
            --hidden-import cryptography `
            --hidden-import berry.model_bridge `
            --hidden-import berry.three_d `
            --hidden-import berry.diagnostics `
            --collect-all imageio_ffmpeg `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import multipart `
            --hidden-import PIL.WebPImagePlugin `
            berry_launcher.py
      - name: Validate EXE self-test
        shell: pwsh
        run: |
          & ".\dist\BERRY_AI_AUTOPILOT\BERRY_AI_AUTOPILOT.exe" --self-test | Out-File -Encoding utf8 ".\dist\berry-self-test.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content ".\dist\berry-self-test.json" | ConvertFrom-Json | Out-Null
      - name: Bundle portable launcher and README
        shell: pwsh
        run: |
          Copy-Item START_BERRY_PORTABLE.cmd dist\BERRY_AI_AUTOPILOT\
          Copy-Item README_RO.md dist\BERRY_AI_AUTOPILOT\
          Copy-Item .env.example dist\BERRY_AI_AUTOPILOT\
          Compress-Archive -Path dist\BERRY_AI_AUTOPILOT -DestinationPath dist\BERRY_AI_AUTOPILOT_WINDOWS_PORTABLE.zip -Force
      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: BERRY_AI_AUTOPILOT_WINDOWS_PORTABLE
          path: dist/BERRY_AI_AUTOPILOT_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 14
